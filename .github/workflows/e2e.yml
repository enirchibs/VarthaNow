name: E2E tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Hermetic run: the app talks to a fake backend URL that the test suite intercepts (tests/e2e/support).
      VITE_SUPABASE_URL: https://mock.supabase.test
      VITE_SUPABASE_ANON_KEY: test-anon-key
      VARTHANOW_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: tests/requirements.txt }
      - run: npm ci
      - run: npm run build
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on http://localhost:4173 --timeout 60000
      - name: Run E2E (mocked backend)
        run: python -m pytest -m "not live" --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results }
