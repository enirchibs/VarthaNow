name: VaartaNow News Pipeline

on:
  schedule:
    - cron: '20 */2 * * *' # every 2 hours: up to 5 news shorts + 2 videos per run
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  news-shorts:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    # Telugu font so headlines render on the composed news images.
    - name: Install Telugu Font
      run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core

    # 60-word Telugu shorts written by Gemini; replaces the old ingest + ai-queue steps.
    - name: Write News Shorts
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: npm run news -- --max=5

    # Short videos from official channels only (scripts/config/video-channels.json), with our Telugu context.
    - name: Add Short Videos
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: npm run shorts -- --max=2 || true

    - name: Generate Sitemap
      env:
        SITE_URL: ${{ secrets.SITE_URL || 'https://varthanow.pages.dev' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: npm run sitemap || true
