name: VarthaNow News Pipeline

on:
  schedule:
    - cron: '15,45 * * * *' # Runs every 30 minutes (offset at :15 and :45) 24/7
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest-and-process:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: npm ci

    - name: Run News Ingestion
      env:
        VITE_SITE_URL: "https://varthanow.pages.dev"
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: npm run ingest
      
    - name: Run AI Processing Queue
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
      run: npm run ai-queue
      
    - name: Run YouTube Viral Shorts Ingestion
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY || 'AIzaSyBYtVDlqQ8-12y_HgrjSgfIJikfnb-sflg' }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || 'AIzaSyBYtVDlqQ8-12y_HgrjSgfIJikfnb-sflg' }}
      run: npm run shorts || true
      
    - name: Generate Sitemap
      env:
        VITE_SITE_URL: "https://varthanow.pages.dev"
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xceartahttbkdihteynx.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: npm run sitemap || true
