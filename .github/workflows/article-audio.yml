name: VaartaNow Article Audio & YouTube

# "వార్తలు వినండి": adds the Telugu AI voice to newly published articles (from the AI News
# Generator, Live Studio, approved drafts and citizen reports) within about 30 minutes.
# Each article is voiced once; articles with an editor's own recording are skipped.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: article-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

    - name: Article Audio
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: npm run audio -- --max=6

    # Recorded article videos → VaartaNow YouTube channel; our copy is freed once the video is live there.
    # Skips quietly until the YOUTUBE_* secrets are added (see scripts/youtube-auth.ts).
    - name: YouTube Upload
      if: always()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        SITE_URL: ${{ secrets.SITE_URL || 'https://varthanow.pages.dev' }}
      run: npm run youtube -- --max=3
