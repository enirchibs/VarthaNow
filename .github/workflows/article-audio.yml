name: VaartaNow Article Audio

# "వార్తలు వినండి": adds the Telugu AI voice to newly published articles (from the AI News
# Generator, Live Studio, approved drafts and citizen reports) within about 30 minutes.
# Each article is voiced once; articles with an editor's own recording are skipped.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: article-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

    - name: Article Audio
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: npm run audio -- --max=6
